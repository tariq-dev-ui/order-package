<div class="delete-account-dialog" [dir]="dir()">
  <div class="dialog-header">
    <h2 class="dialog-title" translate>حذف حساب</h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <p class="confirmation-message">
      <span translate>هل أنت متأكد أنك تريد حذف هذا الحساب؟</span>
      <strong>"{{ getAccountDisplayName() }}"</strong>
    </p>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button (click)="onCancel()" translate>لا</button>
    <button mat-raised-button color="warn" (click)="onConfirm()" translate>نعم</button>
  </mat-dialog-actions>
</div>
