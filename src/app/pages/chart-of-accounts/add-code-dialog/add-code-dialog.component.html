<div class="add-code-dialog" [dir]="dir()">
  <div class="dialog-header">
    <h2 class="dialog-title" translate>إضافة خانة للكود</h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <div class="message-container">
      <p class="message-text" translate>
        سيتم إضافة خانة صفرية لكود الحساب <strong>"{{ getAccountName() }}"</strong> وكل الحسابات التي تتبعه في شجرة الحسابات.
      </p>
      <p class="question-text" translate>
        هل تود الاستمرار؟
      </p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button (click)="onCancel()" translate>لا</button>
    <button mat-raised-button color="primary" (click)="onConfirm()" translate>نعم</button>
  </mat-dialog-actions>
</div>
