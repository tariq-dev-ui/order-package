<div
  class="hotel-card bg-white p-3 rounded-lg cursor-pointer shadow-xs overflow-hidden border border-gray-100 transition-all duration-200 mt-2"
  [class.selected]="isSelected()" [class.ring-2]="isSelected()" [class.ring-primary-500]="isSelected()"
  [class.bg-primary-50]="isSelected()">

  <!-- Top Section (always visible) -->
  <div class="p-4 flex items-start gap-4 cursor-pointer" (click)="selectHotel.emit(hotelData().HotelID ?? 0)">
    <!-- Hotel Image -->
    <div class="relative">
      <div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0 border border-gray-200">
        <img
          src="/IMG/logo.png"
          alt="Ram Tye Hotel" class="w-full h-full object-cover">
      </div>
      @if (isSelected()) {
      <div
        class="absolute -top-2 -right-2 bg-primary-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow-sm">
        <i class="fas fa-check"></i>
      </div>
      }
    </div>

    <!-- Hotel Info -->
    <div class="flex-1 min-w-0">
      <div class="flex items-start justify-between gap-2">
        <button
          type="button"
          class=" cursor-pointer min-w-0 text-left font-bold text-gray-900 line-clamp-2 hover:underline text-primary-700 hover:text-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-200 rounded"
          (click)="$event.stopPropagation(); openHotelProfileDialog()"
          [attr.aria-label]="('Open hotel profile' | translate) + ': ' + (hotelData().Name ?? ('Hotel' | translate))">
          {{ hotelData().Name }}
        </button>
        <button [class]="getButtonClasses()"
          class="cursor-pointer select-hotel-btn px-3 py-1 rounded-full text-sm flex-shrink-0 transition-colors">
          {{ (isSelected() ? 'Selected' : 'Select') | translate }}@if (isSelected()) { ✓ }
        </button>
      </div>

      <div class="flex items-center gap-2 text-sm text-gray-600 mt-1">
        <i class="fas fa-map-marker-alt text-primary-500 text-xs"></i>
        <span>{{ districtName() }}</span>
      </div>

      <div class="flex items-center gap-1 mt-2">
        @for (star of [].constructor(hotelData().OfficialRating); track $index) {
        <i class="fas fa-star text-amber-400 text-xs"></i>
        }
      </div>
    </div>
  </div>

  <!-- Expanded Section (visible when selected) -->
  @if (isSelected()) {
  <div class="px-4 pb-4 animate-expand">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
     

      <div class="custom-select">
        <!-- <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2">
          <i class="fas fa-door-open text-primary-500"></i>
          <span>Room Type</span>
        </label> -->
        <select class="w-full p-3" >
          <option value="">{{ 'Select Room Type' | translate }}</option>
          <option value="">{{ 'Select Room Type' | translate }}</option>
          <option value="">{{ 'Select Room Type' | translate }}</option>
          <option value="">{{ 'Select Room Type' | translate }}</option>
        </select>
      </div>

      <div>
        <!-- <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2">
          <i class="fas fa-moon text-primary-500"></i>
          <span>Number of Nights</span>
        </label> -->
        <counter-input [value]="3" [icon]="'fas fa-moon'" [singularLabel]="'Night'"
          [pluralLabel]="'Nights'" />
      </div>
    </div>
  </div>
}
</div>
