<div class="flex flex-col h-[95vh]">
    <!-- Header -->
    <div class="flex justify-between items-center px-6 py-5 border-b border-gray-100 bg-white sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-primary-50 flex items-center justify-center border border-primary-100">
                <i class="fas fa-users-cog text-primary-500 text-lg"></i>
            </div>
            <h2 class="text-xl font-bold text-primary-500 m-0">{{ 'Manage Package Agents' | translate }}</h2>
        </div>
        <button mat-icon-button mat-dialog-close class="text-gray-400 hover:text-gray-600 hover:bg-gray-50 transition-colors">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-5 bg-white custom-scroll">
        <app-multi-agent-selector
            [selectedUsers]="selectedAgentIds()"
            (selectionChanged)="onSelectionChanged($event)">
        </app-multi-agent-selector>
    </div>

    <!-- Footer -->
    <div class="px-6 py-5 border-t border-gray-100 bg-gray-50 flex items-center justify-end gap-3 sticky bottom-0 z-10">
        <button mat-stroked-button mat-dialog-close [disabled]="isSaving()" 
            class="!px-6 !h-11 !rounded-lg !border-gray-300 !text-gray-700 hover:!bg-gray-100 transition-colors">
            {{ 'Cancel' | translate }}
        </button>
        <button mat-flat-button color="primary" (click)="save()" [disabled]="isSaving()" 
            class="!px-8 !h-11 !rounded-lg shadow-sm hover:shadow-md transition-all min-w-[160px]">
            <div class="flex items-center justify-center gap-2">
                @if (isSaving()) {
                    <mat-spinner diameter="18" class="!w-[18px] !h-[18px]"></mat-spinner>
                    <span>{{ 'Saving...' | translate }}</span>
                } @else {
                    <span>{{ 'Save Changes' | translate }}</span>
                }
            </div>
        </button>
    </div>
</div>
