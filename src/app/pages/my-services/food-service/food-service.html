<service-page-shell
  title="Food Service / خدمة الطعام"
  subtitle="Configure meal plans and quantities / إعداد خطط الوجبات والكميات"
  iconClass="fas fa-utensils text-lg"
  [highlights]="['Meal Matrix', 'Plan Variety', 'Guest Volume']"
>
  <div service-stage class="p-5 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Food Type / نوع الخدمة</span>
        <select class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50">
          <option>Buffet</option>
          <option>Set Menu</option>
          <option>Snacks</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Meal Plan / خطة الوجبات</span>
        <select class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50">
          <option>Breakfast</option>
          <option>Half Board</option>
          <option>Full Board</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Meals Count / عدد الوجبات</span>
        <input type="number" min="1" value="20"
          class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50" />
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Serving Date / تاريخ التقديم</span>
        <input type="date"
          class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50" />
      </label>
      <label class="block md:col-span-2">
        <span class="text-sm font-medium text-gray-700">Special Notes / ملاحظات خاصة</span>
        <textarea rows="2"
          class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50"
          placeholder="Dietary requests, serving window..."></textarea>
      </label>
    </div>

    <div class="rounded-lg border border-primary-100 bg-primary-50/40 p-3.5">
      <p class="text-xs text-gray-500 mb-2">Added service preview / معاينة الخدمة</p>
      <div class="flex flex-wrap gap-2">
        <span class="px-2.5 py-1 rounded-full bg-white border text-xs">Buffet</span>
        <span class="px-2.5 py-1 rounded-full bg-white border text-xs">Full Board</span>
        <span class="px-2.5 py-1 rounded-full bg-white border text-xs">20 Meals</span>
      </div>
    </div>
  </div>
</service-page-shell>
