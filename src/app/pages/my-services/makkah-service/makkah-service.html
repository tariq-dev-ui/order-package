<service-page-shell
  title="Makkah Service"
  subtitle="Hotel criteria and room setup for Makkah service"
  iconClass="fas fa-kaaba text-lg"
  accent="emerald"
  [highlights]="['Near Haram', 'Flexible Stays', 'Room Bundles']"
>
  <div service-stage class="p-6 space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <label class="block">
        <span class="text-sm font-medium text-gray-700">District</span>
        <select class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50">
          <option>Al Haram</option>
          <option>Ajyad</option>
          <option>Al Aziziyah</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Category</span>
        <select class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50">
          <option>5 Stars</option>
          <option>4 Stars</option>
          <option>3 Stars</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Room Type</span>
        <select class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50">
          <option>Double Room</option>
          <option>Triple Room</option>
          <option>Quad Room</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Room Count</span>
        <input type="number" min="1" value="1" class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50" />
      </label>
    </div>

    <label class="flex items-center gap-2 text-sm text-gray-700">
      <input type="checkbox" class="accent-primary-500 w-4 h-4" checked />
      Enable number of nights for all rooms
    </label>

    <div class="rounded-lg border border-emerald-100 bg-emerald-50/60 p-4">
      <p class="text-sm text-gray-500 mb-2">Added service preview</p>
      <div class="flex flex-wrap gap-2">
        <span class="px-3 py-1 rounded-full bg-white border text-sm">Al Haram - 5 Stars</span>
        <span class="px-3 py-1 rounded-full bg-white border text-sm">4 Rooms</span>
        <span class="px-3 py-1 rounded-full bg-white border text-sm">6 Nights</span>
      </div>
    </div>
  </div>
</service-page-shell>
