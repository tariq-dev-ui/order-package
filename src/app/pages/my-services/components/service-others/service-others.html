<div class="p-5">
  <div class="flex items-center gap-3 mb-5">
    <div
      class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 text-white flex items-center justify-center">
      <i class="fas fa-calendar-check text-lg"></i>
    </div>
    <div>
      <h3 class="text-xl font-bold">Others (Final Details)</h3>
      <p class="text-sm text-gray-500">Shared details applied to this single service request</p>
    </div>
  </div>

  <div class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Start Date</span>
        <input type="date" class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50" />
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">End Date</span>
        <input type="date" class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50" />
      </label>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Number of Guests</span>
        <input type="number" min="1" value="1" class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50" />
      </label>
      <div class="block">
        <span class="text-sm font-medium text-gray-700">Visa</span>
        <label class="mt-3 flex items-center gap-2 text-sm text-gray-700">
          <input type="checkbox" class="accent-primary-500 w-4 h-4" />
          Include visa in service details
        </label>
      </div>
    </div>

    <label class="block">
      <span class="text-sm font-medium text-gray-700">Additional Notes</span>
      <textarea rows="2" class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50"
        placeholder="Add optional notes for this service..."></textarea>
    </label>
  </div>
</div>
