<div class="font-sans text-gray-800 antialiased">
  <div class="min-h-screen">
    <main class="container mx-auto px-3 sm:px-5 lg:px-5 py-5">
      <div class="w-full">
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
          <div class="p-5 border-b border-gray-100 bg-gradient-to-r" [ngClass]="headerClass()">
            <div class="flex items-start justify-between gap-4">
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-full bg-gradient-to-br text-white flex items-center justify-center"
                  [ngClass]="iconClassName()">
                  <i [class]="iconClass"></i>
                </div>
                <div>
                  <h2 class="text-xl font-bold">{{ title }}</h2>
                  <p class="text-sm text-gray-500">{{ subtitle }}</p>
                </div>
              </div>
              <span class="text-xs px-3 py-1 rounded-full font-medium" [ngClass]="badgeClass()">
                Standalone Service Order
              </span>
            </div>
            @if (highlights.length > 0) {
            <div class="mt-3 flex flex-wrap gap-2">
              @for (item of highlights; track item) {
              <span class="text-xs px-2.5 py-1 rounded-full border font-medium" [ngClass]="highlightChipClass()">
                {{ item }}
              </span>
              }
            </div>
            }
          </div>

          <div class="grid grid-cols-1 xl:grid-cols-12">
            <section class="xl:col-span-7 border-b xl:border-b-0 xl:border-r border-gray-100">
              <ng-content select="[service-stage]"></ng-content>
            </section>
            <section class="xl:col-span-5 bg-gray-50/40">
              <service-others />
            </section>
          </div>

          <div class="p-4 border-t border-gray-100 bg-white">
            <div class="flex justify-end gap-3">
              <span class="sr-only" aria-live="polite">{{ lastLocalAction() }}</span>
              <button
                type="button"
                (click)="saveDraft()"
                class="px-4 py-2 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
                Save Draft
              </button>
              <button
                type="button"
                (click)="submitService()"
                class="px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white transition-colors">
                Submit Service
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
