<service-page-shell
  title="Tickets Service / خدمة التذاكر"
  subtitle="Prepare flight and seat requirements / تجهيز الرحلات والمقاعد"
  iconClass="fas fa-ticket-alt text-lg"
  [highlights]="['Flight Ready', 'Seat Planning', 'Class Selection']"
>
  <div service-stage class="p-5 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Source City / مدينة المغادرة</span>
        <select class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50">
          <option>Cairo</option>
          <option>Dubai</option>
          <option>Amman</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Destination / الوجهة</span>
        <select class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50">
          <option>Jeddah</option>
          <option>Madinah</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Airline / شركة الطيران</span>
        <select class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50">
          <option>Saudia</option>
          <option>Flynas</option>
          <option>Qatar Airways</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Travel Class / درجة السفر</span>
        <select class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50">
          <option>Economy</option>
          <option>Business</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Seats / عدد المقاعد</span>
        <input type="number" min="1" value="10"
          class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50" />
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Departure Date / تاريخ الرحلة</span>
        <input type="date"
          class="mt-1.5 w-full p-2.5 text-sm border border-gray-200 rounded-lg bg-gray-50" />
      </label>
    </div>

    <div class="rounded-lg border border-primary-100 bg-primary-50/40 p-3.5">
      <p class="text-xs text-gray-500 mb-2">Added service preview / معاينة الخدمة</p>
      <div class="flex flex-wrap gap-2">
        <span class="px-2.5 py-1 rounded-full bg-white border text-xs">Cairo → Jeddah</span>
        <span class="px-2.5 py-1 rounded-full bg-white border text-xs">Saudia - Economy</span>
        <span class="px-2.5 py-1 rounded-full bg-white border text-xs">10 Seats</span>
      </div>
    </div>
  </div>
</service-page-shell>
