<service-page-shell
  title="Tickets Service"
  subtitle="Prepare flight and seat requirements for the service"
  iconClass="fas fa-ticket-alt text-lg"
  accent="amber"
  [highlights]="['Flight Ready', 'Seat Planning', 'Class Selection']"
>
  <div service-stage class="p-6 space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Source City</span>
        <select class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50">
          <option>Cairo</option>
          <option>Dubai</option>
          <option>Amman</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Destination City</span>
        <select class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50">
          <option>Jeddah</option>
          <option>Madinah</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Airline</span>
        <select class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50">
          <option>Saudia</option>
          <option>Flynas</option>
          <option>Qatar Airways</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-gray-700">Travel Class</span>
        <select class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50">
          <option>Economy</option>
          <option>Business</option>
        </select>
      </label>
      <label class="block md:col-span-2">
        <span class="text-sm font-medium text-gray-700">Seats</span>
        <input type="number" min="1" value="10"
          class="mt-2 w-full p-3 border border-gray-200 rounded-lg bg-gray-50" />
      </label>
    </div>

    <div class="rounded-lg border border-amber-100 bg-amber-50/60 p-4">
      <p class="text-sm text-gray-500 mb-2">Added service preview</p>
      <div class="flex flex-wrap gap-2">
        <span class="px-3 py-1 rounded-full bg-white border text-sm">Cairo → Jeddah</span>
        <span class="px-3 py-1 rounded-full bg-white border text-sm">Saudia - Economy</span>
        <span class="px-3 py-1 rounded-full bg-white border text-sm">10 Seats</span>
      </div>
    </div>
  </div>
</service-page-shell>
